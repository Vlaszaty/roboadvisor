[project]
name = "roboadvisor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=2.2,<3",
    "pyportfolioopt>=1.6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
